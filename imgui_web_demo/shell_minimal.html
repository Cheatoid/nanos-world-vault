<!DOCTYPE HTML>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
	<style>
		* {
			margin: 0 !important;
			padding: 0 !important;
			border: 0 !important;
		}

		html,
		body {
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: transparent !important;
			background-color: transparent !important;
		}

		.emscripten {
			position: absolute;
			top: 0px;
			left: 0px;
			margin: 0px;
			border: 0;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			display: block;
			background: transparent !important;
			background-color: transparent !important;
			image-rendering: optimizeSpeed;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: crisp-edges;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}

		#canvas {
			background: transparent !important;
			background-color: transparent !important;
		}

		#canvas:focus {
			outline: none;
		}

		::-webkit-scrollbar {
			display: none;
		}

		#error-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(20, 0, 0, 0.95);
			z-index: 9999;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			color: #ff6666;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			padding: 40px;
			text-align: center;
		}

		#error-overlay h1 {
			font-size: 32px;
			margin-bottom: 20px;
		}

		#error-overlay p {
			font-size: 16px;
			line-height: 1.6;
			max-width: 600px;
		}
	</style>
</head>

<body>
<div id="error-overlay">
	<h1>WebGPU Error</h1>
	<p id="error-message"></p>
</div>
<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
<script type="text/javascript">
	window.showWebGPUError = function (message) {
		const overlay = document.getElementById('error-overlay');
		const msgElement = document.getElementById('error-message');
		if (overlay && msgElement) {
			msgElement.textContent = message;
			overlay.style.display = 'flex';
		}
	};

	// Check if running in CEF (nanos-world) vs regular browser
	window.isCEF = window.location.href.includes('file://') || !window.chrome || window.location.protocol === 'file:';

	// Flag to control initial window positioning
	window.useInitialPositioning = true;

	// Transparent overlay: only ImGui windows should be visible in-game.
	// CSS already forces transparent backgrounds; these inline styles are
	// belt-and-braces against anything the engine/runtime may set later.
	(function forceTransparency() {
		try {
			const root = document.documentElement;
			if (root) root.style.background = 'transparent';
			if (document.body) document.body.style.background = 'transparent';
			const canvas = document.getElementById('canvas');
			if (canvas) canvas.style.background = 'transparent';
		} catch (e) { /* DOM not ready in some embeddings; CSS covers it */ }
	})();
	var Module = {
		preRun: [],
		postRun: [],
		print: (() => function (text) {
			text = Array.prototype.slice.call(arguments).join(" ");
			console.log(text);
		})(),
		printErr: function (text) {
			text = Array.prototype.slice.call(arguments).join(" ");
			console.error(text);
		},
		canvas: (() => {
			var canvas = document.getElementById("canvas");
			//canvas.addEventListener("webglcontextlost", function(e) { alert("FIXME: WebGL context lost, please reload the page"); e.preventDefault(); }, false);
			return canvas;
		})(),
		setStatus: text => {
			console.log("status: " + text);
		},
		monitorRunDependencies: function (left) {
			// no run dependencies to log
		}
	};
	window.onerror = () => {
		console.log("onerror: " + event);
	};

	// =====================================================================
	// SECTION 0: Engine bridge - same protocol as library/Client/UI/EvalAPI.html
	// so the Lua EvalAPI pattern works verbatim against this page:
	//   Lua -> JS : Events.Subscribe("DoEval") / ("DoEvalWithContext")
	//   JS  -> Lua: Events.Call("EvalResult", id, success, payload)
	//   JS  -> Lua: Events.Call("EvalReady") on DOM ready,
	//               Events.Call("ImGuiReady", info) on DOM ready + WASM init.
	// Tolerates plain browsers where window.Events is undefined.
	// ALSO supports embedding inside library/Client/UI/ImGui.html via
	// postMessage relay (required: cross-origin iframe has no window.Events):
	//   parent -> child: { __imgui_bridge: 1, type: "eval", id, code, context }
	//   child -> parent: { __imgui_bridge: 1, type: "result", id, ok, payload }
	//   child -> parent: { __imgui_bridge: 1, type: "ready", kind: "dom"|"wasm", info }
	// =====================================================================
	var EngineEvents = null;
	try { EngineEvents = window.Events || null; } catch (e) { EngineEvents = null; }
	function engineEvents() {
		if (!EngineEvents) { try { EngineEvents = window.Events || null; } catch (e) { /* no engine */ } }
		return EngineEvents;
	}
	function isInIframe() {
		try { return window.self !== window.top; } catch (e) { return true; }
	}
	function postToParent(msg) {
		try {
			if (window.parent && window.parent !== window.self) {
				window.parent.postMessage(Object.assign({ __imgui_bridge: 1 }, msg), "*");
			}
		} catch (e) { /* cross-origin parent unreachable */ }
	}
	const Bridge = { domReady: false, imguiReady: false };
	let bridgeSubscribed = false;
	function evalCode(code, context) {
		context = context || {};
		const keys = Object.keys(context);
		const vals = Object.values(context);
		const fn = new Function(...keys, '"use strict"; return (' + code + ');');
		return fn(...vals);
	}
	function bridgeSend(id, success, payload) {
		const ev = engineEvents();
		if (ev && ev.Call) { try { ev.Call("EvalResult", id, success, payload); } catch (e) { console.error("EvalResult send failed:", e); } }
	}
	function bridgeReply(id, fn, ...args) {
		let ok = true, out = null;
		try { out = fn(...args); if (typeof out === 'undefined') out = null; }
		catch (e) { ok = false; out = String((e && e.stack) || e); }
		bridgeSend(id, ok, out);
	}
	function bridgeSubscribe() {
		if (bridgeSubscribed) return;
		const ev = engineEvents();
		if (!ev || !ev.Subscribe) return;
		ev.Subscribe("DoEval", (id, code) => bridgeReply(id, evalCode, code));
		ev.Subscribe("DoEvalWithContext", (id, code, context) => bridgeReply(id, evalCode, code, context));
		bridgeSubscribed = true;
	}
	function bridgeInfo() {
		var uiVersion = "unknown";
		var views = [];
		try { if (typeof UI !== "undefined" && UI && UI.version) uiVersion = UI.version; } catch (e) { }
		try { if (typeof listViews === "function") views = listViews(); } catch (e) { }
		return {
			page: 'imgui_web_demo', uiVersion: uiVersion,
			domReady: Bridge.domReady, imguiReady: Bridge.imguiReady, views: views
		};
	}
	function bridgeReady() {
		bridgeSubscribe();
		if (Bridge.domReady) return;
		Bridge.domReady = true;
		var info = null;
		try { info = bridgeInfo(); } catch (e) { info = { page: 'imgui_web_demo', domReady: true, imguiReady: false }; }
		const ev = engineEvents();
		if (ev && ev.Call) {
			try { ev.Call("EvalReady"); } catch (e) { }
			try { ev.Call("ImGuiReady", info); } catch (e) { }
		}
		// Notify embedding host (UI/ImGui.html) via postMessage; harmless standalone.
		try { postToParent({ type: "ready", kind: "dom", info: info }); } catch (e) { }
	}
	function markImGuiReady() {
		Bridge.imguiReady = true;
		var info = null;
		try { info = bridgeInfo(); } catch (e) { info = { page: 'imgui_web_demo', domReady: Bridge.domReady, imguiReady: true }; }
		const ev = engineEvents();
		if (ev && ev.Call) { try { ev.Call("ImGuiReady", info); } catch (e) { } }
		try { postToParent({ type: "ready", kind: "wasm", info: info }); } catch (e) { }
	}
	// postMessage relay: parent (UI/ImGui.html) forwards Lua DoEval here.
	// Reply via postMessage (NOT via Events: iframe has no engine Events).
	try {
		window.addEventListener("message", function (e) {
			var d = e && e.data;
			if (!d || !d.__imgui_bridge || d.type !== "eval") return;
			var id = d.id, code = d.code, context = d.context || {};
			var ok = true, out = null;
			try { out = evalCode(code, context); if (typeof out === 'undefined') out = null; }
			catch (err) { ok = false; out = String((err && err.stack) || err); }
			postToParent({ type: "result", id: id, ok: ok, payload: out });
		});
	} catch (e) { /* postMessage unavailable */ }
	bridgeSubscribe();
	if (typeof document !== 'undefined' && document.addEventListener) {
		document.addEventListener("DOMContentLoaded", bridgeReady);
		window.addEventListener("load", bridgeReady);
	}

	// =====================================================================
	// SECTION 1: Store - shared widget state + frame event queue.
	// Top-level so the ImGui wrappers (SECTION 2) and window.UI (SECTION 4)
	// operate on the same data. Everything here is JSON-serializable.
	// =====================================================================
	const boolStorage = new Map();
	const floatStorage = new Map();
	const intStorage = new Map();
	const stringStorage = new Map();
	const stringBufferSize = 256;
	function getBool(key, def) {
		if (!boolStorage.has(key)) boolStorage.set(key, def);
		return boolStorage.get(key);
	}
	function getFloat(key, def) {
		if (!floatStorage.has(key)) floatStorage.set(key, def);
		return floatStorage.get(key);
	}
	function getInt(key, def) {
		if (!intStorage.has(key)) intStorage.set(key, def);
		return intStorage.get(key);
	}
	function getFloatArray(key, def) {
		if (!floatStorage.has(key)) floatStorage.set(key, def.slice());
		const v = floatStorage.get(key);
		if (!Array.isArray(v) || v.length !== def.length) { floatStorage.set(key, def.slice()); return floatStorage.get(key); }
		return v;
	}
	function getIntArray(key, def) {
		if (!intStorage.has(key)) intStorage.set(key, def.slice());
		const v = intStorage.get(key);
		if (!Array.isArray(v) || v.length !== def.length) { intStorage.set(key, def.slice()); return intStorage.get(key); }
		return v;
	}
	const eventQueue = [];
	let frameIndex = 0;
	function emitEvent(type, data) {
		const e = { type: type, frame: frameIndex };
		if (data) for (const k in data) e[k] = data[k];
		eventQueue.push(e);
		if (eventQueue.length > 256) eventQueue.splice(0, eventQueue.length - 256);
	}

	// =====================================================================
	// SECTION 4: window.UI facade - small JSON-safe functions for Lua.
	// Call with one-line evals, e.g:
	//   UI.call('registerView', {'hud', 'ImGui.Begin("HUD"); ImGui.Text("hi"); ImGui.End();'})
	//   UI.call('setShowDemo', {false})
	//   UI.call('snapshot', {})
	//   UI.call('pollEvents', {})
	//   UI.call('set', {'gal_speed', 7.5})
	// UI.call / UI.batch always return { ok, result?, error? }.
	// =====================================================================
	const customViews = new Map(); // id -> { fn, error }
	function listViews() { return [...customViews.keys()]; }
	function registerView(id, source) {
		if (typeof id !== 'string' || !id) throw new Error('registerView: id must be a non-empty string');
		if (typeof source !== 'string' || !source) throw new Error('registerView: source must be a non-empty string');
		const fn = new Function('ImGui', 'UI', 'fps', '"use strict";\n' + source);
		customViews.set(id, { fn: fn, error: null });
		return { id: id, views: listViews() };
	}
	function unregisterView(id) { const had = customViews.delete(id); return { id: id, removed: had, views: listViews() }; }
	function clearViews() { customViews.clear(); return { views: [] }; }
	function viewErrors() {
		const out = [];
		for (const [id, v] of customViews) if (v.error) out.push({ id: id, error: v.error });
		return out;
	}
	function runCustomViews(fps) {
		for (const [id, v] of customViews) {
			try { v.fn(ImGui, UI, fps); v.error = null; }
			catch (e) { v.error = String((e && e.message) || e); console.error('custom view "' + id + '" error:', e); }
		}
	}
	const UI = {
		version: '1.2.0',
		showDemo: true, // set false from Lua to hide the built-in demo windows
		status() {
			return {
				domReady: Bridge.domReady, imguiReady: Bridge.imguiReady,
				demo: UI.showDemo !== false, frame: frameIndex,
				views: listViews(), viewErrors: viewErrors(), queuedEvents: eventQueue.length,
				uiVersion: UI.version
			};
		},
		registerView(id, source) { return registerView(id, source); },
		unregisterView(id) { return unregisterView(id); },
		clearViews() { return clearViews(); },
		listViews() { return listViews(); },
		viewErrors() { return viewErrors(); },
		setShowDemo(b) { UI.showDemo = !!b; return { demo: UI.showDemo }; },
		get(key) {
			if (boolStorage.has(key)) return { found: true, value: boolStorage.get(key) };
			if (stringStorage.has(key)) return { found: true, value: stringStorage.get(key) };
			if (floatStorage.has(key)) { const v = floatStorage.get(key); return { found: true, value: Array.isArray(v) ? v.slice() : v }; }
			if (intStorage.has(key)) { const v = intStorage.get(key); return { found: true, value: Array.isArray(v) ? v.slice() : v }; }
			return { found: false, value: null };
		},
		set(key, value) {
			if (typeof value === 'boolean') { boolStorage.set(key, value); return UI.get(key); }
			if (typeof value === 'number') {
				floatStorage.set(key, value);
				if (Number.isInteger(value)) intStorage.set(key, value);
				return UI.get(key);
			}
			if (typeof value === 'string') { stringStorage.set(key, value); return UI.get(key); }
			if (Array.isArray(value) && value.every((v) => typeof v === 'number')) {
				floatStorage.set(key, value.slice());
				if (value.every((v) => Number.isInteger(v))) intStorage.set(key, value.slice());
				return UI.get(key);
			}
			throw new Error('set: unsupported value for key "' + key + '" (bool/number/string/number[] only)');
		},
		getMany(keys) { const o = {}; for (const k of (keys || [])) o[k] = UI.get(k).value; return o; },
		setMany(obj) { let n = 0; for (const k in obj) { UI.set(k, obj[k]); n++; } return { updated: n }; },
		snapshot() {
			const pick = (m) => { const o = {}; for (const [k, v] of m) o[k] = Array.isArray(v) ? v.slice() : v; return o; };
			return {
				frame: frameIndex,
				bool: pick(boolStorage), float: pick(floatStorage),
				int: pick(intStorage), string: pick(stringStorage)
			};
		},
		pollEvents() { const out = eventQueue.slice(); eventQueue.length = 0; return out; },
		peekEvents() { return eventQueue.slice(); },
		setTheme(name, overrides) { return ImGui.SetTheme(name, overrides); },
		setStyleColor(idxOrName, color) { ImGui.SetStyleColor(idxOrName, color); return { color: idxOrName }; },
		setStyleFloat(field, value) { ImGui.SetStyleFloat(field, value); return { field: field, value: value }; },
		setStyleVec2(field, x, y) { ImGui.SetStyleVec2(field, x, y); return { field: field, value: [x, y] }; },
		getStyleColorCount() { return ImGui.GetStyleColorCount(); },
		evalJs(code, context) { const r = evalCode(code, context || {}); return (typeof r === 'undefined') ? null : r; },
		call(method, args) {
			try {
				const fn = UI[method];
				if (typeof fn !== 'function') throw new Error('unknown UI method: ' + method);
				const r = fn.apply(UI, args || []);
				return { ok: true, result: (typeof r === 'undefined') ? null : r };
			} catch (e) { return { ok: false, error: String((e && e.message) || e) }; }
		},
		batch(calls) { return (calls || []).map((c) => UI.call(c[0], c.slice(1))); }
	};
	window.UI = UI;
	window.ImGuiBridge = Bridge;

	// ImGui namespace - will be populated after Module initializes
	var ImGui = {};

	// SECTION 2: Bindings - cwrap imports + stateful JS wrappers (populates window.ImGui).
	// Deferred init function called from Module.onRuntimeInitialized
	function initImGuiAPI() {
		const cwrap = Module.cwrap;

		// Shared stores live at top-level (SECTION 1) so window.UI sees them too.
		let boolPtr, floatPtr, intPtr, stringPtr;

		function initMemory() {
			boolPtr = Module._malloc(1);
			floatPtr = Module._malloc(16);
			intPtr = Module._malloc(4);
			stringPtr = Module._malloc(stringBufferSize);
		}

		// Wrap C++ functions
		const _Begin = cwrap('imgui_Begin', 'void', ['string', 'number', 'number']);
		const _End = cwrap('imgui_End', 'void', []);
		const _ShowDemoWindow = cwrap('imgui_ShowDemoWindow', 'void', ['number']);
		const _Text = cwrap('imgui_Text', 'void', ['string']);
		const _TextWrapped = cwrap('imgui_TextWrapped', 'void', ['string']);
		const _TextDisabled = cwrap('imgui_TextDisabled', 'void', ['string']);
		const _TextColored = cwrap('imgui_TextColored', 'void', ['number', 'number', 'number', 'number', 'string']);
		const _LabelText = cwrap('imgui_LabelText', 'void', ['string', 'string']);
		const _Button = cwrap('imgui_Button', 'number', ['string', 'number', 'number']);
		const _SmallButton = cwrap('imgui_SmallButton', 'number', ['string']);
		const _ArrowButton = cwrap('imgui_ArrowButton', 'number', ['string', 'number']);
		const _InvisibleButton = cwrap('imgui_InvisibleButton', 'number', ['string', 'number', 'number', 'number']);
		const _Checkbox = cwrap('imgui_Checkbox', 'number', ['string', 'number']);
		const _CheckboxFlags = cwrap('imgui_CheckboxFlags', 'number', ['string', 'number', 'number']);
		const _SliderFloat = cwrap('imgui_SliderFloat', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _SliderInt = cwrap('imgui_SliderInt', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _SliderFloat2 = cwrap('imgui_SliderFloat2', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _SliderFloat3 = cwrap('imgui_SliderFloat3', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _SliderFloat4 = cwrap('imgui_SliderFloat4', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _SliderInt2 = cwrap('imgui_SliderInt2', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _SliderInt3 = cwrap('imgui_SliderInt3', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _SliderInt4 = cwrap('imgui_SliderInt4', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _SliderAngle = cwrap('imgui_SliderAngle', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _VSliderFloat = cwrap('imgui_VSliderFloat', 'number', ['string', 'number', 'number', 'number', 'number', 'number', 'string', 'number']);
		const _VSliderInt = cwrap('imgui_VSliderInt', 'number', ['string', 'number', 'number', 'number', 'number', 'number', 'string', 'number']);
		const _ColorEdit3 = cwrap('imgui_ColorEdit3', 'number', ['string', 'number', 'number']);
		const _ColorEdit4 = cwrap('imgui_ColorEdit4', 'number', ['string', 'number', 'number']);
		const _ColorPicker3 = cwrap('imgui_ColorPicker3', 'number', ['string', 'number', 'number']);
		const _ColorPicker4 = cwrap('imgui_ColorPicker4', 'number', ['string', 'number', 'number']);
		const _ColorButton = cwrap('imgui_ColorButton', 'number', ['string', 'number', 'number', 'number', 'number', 'number', 'number', 'number']);
		// InputText uses direct ccall to avoid char*/string conversion issues
		const _InputText = cwrap('imgui_InputText', 'number', ['string', 'number', 'number', 'number', 'number', 'number']);
		const _InputTextMultiline = cwrap('imgui_InputTextMultiline', 'number', ['string', 'number', 'number', 'number', 'number', 'number']);
		const _InputTextWithHint = cwrap('imgui_InputTextWithHint', 'number', ['string', 'string', 'number', 'number', 'number']);
		const _InputFloat = cwrap('imgui_InputFloat', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _InputFloat2 = cwrap('imgui_InputFloat2', 'number', ['string', 'number', 'string', 'number']);
		const _InputFloat3 = cwrap('imgui_InputFloat3', 'number', ['string', 'number', 'string', 'number']);
		const _InputFloat4 = cwrap('imgui_InputFloat4', 'number', ['string', 'number', 'string', 'number']);
		const _InputInt = cwrap('imgui_InputInt', 'number', ['string', 'number', 'number', 'number', 'number']);
		const _InputInt2 = cwrap('imgui_InputInt2', 'number', ['string', 'number', 'number']);
		const _InputInt3 = cwrap('imgui_InputInt3', 'number', ['string', 'number', 'number']);
		const _InputInt4 = cwrap('imgui_InputInt4', 'number', ['string', 'number', 'number']);
		const _InputDouble = cwrap('imgui_InputDouble', 'number', ['string', 'number', 'number', 'number', 'string', 'number']);
		const _SameLine = cwrap('imgui_SameLine', 'void', ['number', 'number']);
		const _Spacing = cwrap('imgui_Spacing', 'void', []);
		const _Separator = cwrap('imgui_Separator', 'void', []);
		const _SeparatorText = cwrap('imgui_SeparatorText', 'void', ['string']);
		const _NewLine = cwrap('imgui_NewLine', 'void', []);
		const _Indent = cwrap('imgui_Indent', 'void', ['number']);
		const _Unindent = cwrap('imgui_Unindent', 'void', ['number']);
		const _Dummy = cwrap('imgui_Dummy', 'void', ['number', 'number']);
		const _TreeNode = cwrap('imgui_TreeNode', 'number', ['string']);
		const _TreeNodeEx = cwrap('imgui_TreeNodeEx', 'number', ['string', 'number']);
		const _TreePop = cwrap('imgui_TreePop', 'void', []);
		const _SelectableEx = cwrap('imgui_SelectableEx', 'number', ['string', 'number', 'number', 'number', 'number']);
		const _SelectableState = cwrap('imgui_SelectableState', 'number', ['string', 'number', 'number', 'number', 'number']);
		const _BeginCombo = cwrap('imgui_BeginCombo', 'number', ['string', 'string', 'number']);
		const _EndCombo = cwrap('imgui_EndCombo', 'void', []);
		const _ComboStr = cwrap('imgui_ComboStr', 'number', ['string', 'number', 'string', 'number', 'number']);
		const _ListBoxStr = cwrap('imgui_ListBoxStr', 'number', ['string', 'number', 'string', 'number']);
		const _ProgressBarEx = cwrap('imgui_ProgressBarEx', 'void', ['number', 'number', 'number', 'string']);
		const _PlotLines = cwrap('imgui_PlotLines', 'void', ['string', 'number', 'number', 'string', 'number', 'number', 'number', 'number']);
		const _PlotHistogram = cwrap('imgui_PlotHistogram', 'void', ['string', 'number', 'number', 'string', 'number', 'number', 'number', 'number']);
		const _Bullet = cwrap('imgui_Bullet', 'void', []);

			const changed = _DragFloat(label, floatPtr, speed, min, max, fmt, flags) !== 0;
			const newVal = Module.getValue(floatPtr, 'float');
			floatStorage.set(key, newVal);
			return { changed, value: newVal };
		};
		ImGui.DragInt = function (label, key, speed = 1, min = 0, max = 0, fmt = "%d", flags = 0, def = 0) {
			const val = getInt(key, def);
			Module.setValue(intPtr, val, 'i32');
			const changed = _DragInt(label, intPtr, speed, min, max, fmt, flags) !== 0;
			const newVal = Module.getValue(intPtr, 'i32');
			intStorage.set(key, newVal);
			return { changed, value: newVal };
		};
		function dragFloatN(n, cfunc, label, key, speed, min, max, fmt, flags, def) {
			const arr = getFloatArray(key, def);
			for (let i = 0; i < n; i++) Module.setValue(floatPtr + i * 4, arr[i], 'float');
			const changed = cfunc(label, floatPtr, speed, min, max, fmt, flags) !== 0;
			for (let i = 0; i < n; i++) arr[i] = Module.getValue(floatPtr + i * 4, 'float');
			return { changed, value: arr.slice() };
		}
		ImGui.DragFloat2 = function (label, key, speed = 1, min = 0, max = 0, fmt = "%.3f", flags = 0, def = [0, 0]) {
			return dragFloatN(2, _DragFloat2, label, key, speed, min, max, fmt, flags, def);
		};
		ImGui.DragFloat3 = function (label, key, speed = 1, min = 0, max = 0, fmt = "%.3f", flags = 0, def = [0, 0, 0]) {
			return dragFloatN(3, _DragFloat3, label, key, speed, min, max, fmt, flags, def);
		};
		ImGui.DragFloat4 = function (label, key, speed = 1, min = 0, max = 0, fmt = "%.3f", flags = 0, def = [0, 0, 0, 0]) {
			return dragFloatN(4, _DragFloat4, label, key, speed, min, max, fmt, flags, def);
		};
		ImGui.DragInt2 = function (label, key, speed = 1, min = 0, max = 0, fmt = "%d", flags = 0, def = [0, 0]) {
			const arr = getIntArray(key, def);
			const p = Module._malloc(8);
			Module.setValue(p, arr[0], 'i32'); Module.setValue(p + 4, arr[1], 'i32');
			const changed = _DragInt2(label, p, speed, min, max, fmt, flags) !== 0;
			arr[0] = Module.getValue(p, 'i32'); arr[1] = Module.getValue(p + 4, 'i32');
			Module._free(p);
			return { changed, value: arr.slice() };
		};
		ImGui.DragFloatRange2 = function (label, keyMin, keyMax, speed = 1, min = 0, max = 0, fmt = "%.3f", fmtMax = "", flags = 0, defMin = 0.0, defMax = 0.0) {
			const vMin = getFloat(keyMin, defMin), vMax = getFloat(keyMax, defMax);
			const p = Module._malloc(8);
			Module.setValue(p, vMin, 'float'); Module.setValue(p + 4, vMax, 'float');
			const changed = _DragFloatRange2(label, p, p + 4, speed, min, max, fmt, fmtMax, flags) !== 0;
			floatStorage.set(keyMin, Module.getValue(p, 'float'));
			floatStorage.set(keyMax, Module.getValue(p + 4, 'float'));
			Module._free(p);
			return { changed, value: [floatStorage.get(keyMin), floatStorage.get(keyMax)] };
		};

		console.log("ImGui API initialized successfully");
		markImGuiReady();
	}
