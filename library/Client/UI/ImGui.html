<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: transparent !important;
		}

		iframe {
			display: block;
			position: fixed;
			inset: 0;
			right: 0;
			bottom: 0;
			min-width: 100%;
			min-height: 100%;
			width: 100vw;
			height: 100vh;
			background: transparent !important;
			cursor: default;
		}

		body,
		iframe {
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
			touch-action: none;
		}

		/* Friendly fallback overlay: replaces the bare CEF dead-page with
			an actionable message (local demo missing, remote unreachable). */
		#fallback-overlay {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 9999;
			justify-content: center;
			align-items: center;
			background: rgba(10, 0, 0, 0.85);
			color: #ffd7d7;
			font-family: Consolas, monospace;
			font-size: 14px;
			line-height: 1.6;
			text-align: center;
			padding: 40px;
		}

		#fallback-overlay.visible {
			display: flex;
		}

		#fallback-overlay .box {
			max-width: 620px;
		}

		#fallback-overlay button {
			margin: 8px 6px 0;
			padding: 8px 18px;
			font: inherit;
			cursor: pointer;
			color: #fff;
			background: #a02040;
			border: 1px solid #ff6080;
			border-radius: 8px;
		}

		#fallback-overlay button.ghost {
			background: transparent;
		}
	</style>
</head>

<body>
	<!-- LOCAL-FIRST demo bootstrap (never a dead page: this file always loads).
		The iframe prefers the UNMINIFIED local build
		(library/Client/UI/ImGuiDemo.html, via `imgui_web_demo/build.cmd debug`:
		same shell_minimal.html shell + Lua bridge, -O0 -g3 SINGLE_FILE so
		file:// needs no extra fetches). No network, no delegation warning.
		If the local file was never built, the bootstrap falls back to the
		remote Pages demo and says so instead of showing a dead page.
		Zero-iframe alternative (direct Events bridge, no relay needed):
		lua imgui.Initialize({url="file://UI/ImGuiDemo.html"}) -->
	<iframe id="imgui" src="./ImGuiDemo.html" frameborder="0" scrolling="no" allowtransparency="true">
		<p>Your browser does not support HTML iframes!</p>
	</iframe>
	<div id="fallback-overlay">
		<div class="box">
			<p id="fallback-message"></p>
			<button id="fallback-remote" type="button">Use remote demo</button>
			<button id="fallback-retry" class="ghost" type="button">Retry local</button>
		</div>
	</div>
	<script>
		// NOTE: Must use 'var' because nanos world engine defines window.Events before this script runs.
		// Using 'const' or 'let' would cause a redeclaration error.
		// noinspection ES6ConvertVarToLetConst
		/** @type {{Call: function(string, ...any): void, Subscribe: function(string, function(...any)): void}} */
		var Events = window.Events;

		// =====================================================================
		// Top-level relay: Lua (ImGui.lua) <-> embedded demo iframe.
		// Same-origin local file (./ImGuiDemo.html) or cross-origin remote
		// fallback both talk postMessage; the relay is origin-agnostic.
		// Protocol (must match shell_minimal.html SECTION 0):
		//   parent -> child: { __imgui_bridge: 1, type: "eval", id, code, context }
		//   child -> parent: { __imgui_bridge: 1, type: "result", id, ok, payload }
		//   child -> parent: { __imgui_bridge: 1, type: "ready", kind: "dom"|"wasm", info }
		// Lua protocol (must match ImGui.lua):
		//   Lua -> JS : Events.Subscribe("DoEval") / ("DoEvalWithContext")
		//   JS -> Lua : Events.Call("EvalResult", id, success, payload)
		//   JS -> Lua : Events.Call("EvalReady") once channel is up,
		//               Events.Call("ImGuiReady", info) on dom + wasm ready.
		// =====================================================================

		var FRAME_ID = "imgui";
		var LOCAL_SRC = "./ImGuiDemo.html";
		var REMOTE_SRC = "https://cheatoid.github.io/nanos-world-vault/imgui_web_demo/index.html";
		var channelReady = false; // true once iframe posted its first ready
		var frameLoaded = false; // true once the iframe fired load (file exists)
		var usingRemote = false;
		var evalReadyEmitted = false;
		var queued = []; // [{ id, code, context }] received before channelReady

		function getFrame() {
			return document.getElementById(FRAME_ID);
		}

		function getOverlay() {
			return document.getElementById("fallback-overlay");
		}

		function showFallback(text) {
			try {
				document.getElementById("fallback-message").textContent = text;
				getOverlay().classList.add("visible");
			} catch (e) { /* overlay missing: console only */ }
		}

		function hideFallback() {
			try { getOverlay().classList.remove("visible"); } catch (e) { /* noop */ }
		}

		function setFrameSrc(src) {
			var frame = getFrame();
			if (!frame) return;
			frameLoaded = false;
			try { frame.src = src; } catch (e) {
				console.error("ImGuiHost: failed to set frame src:", e);
			}
		}

		function useRemote(reason) {
			if (usingRemote) return;
			usingRemote = true;
			console.error("ImGuiHost: " + reason + " Falling back to remote demo.");
			showFallback(reason + " Falling back to remote demo. Build the local file with imgui_web_demo/build.cmd debug.");
			setFrameSrc(REMOTE_SRC);
		}

		function forceTransparency() {
			try {
				if (document.documentElement) document.documentElement.style.background = "transparent";
				if (document.body) document.body.style.background = "transparent";
				var frame = getFrame();
				if (frame) frame.style.background = "transparent";
			} catch (error) {
				console.warn("ImGuiHost: failed to force transparency:", error);
			}
		}

		function postToFrame(id, code, context) {
			var frame = getFrame();
			if (!frame || !frame.contentWindow) return false;
			try {
				frame.contentWindow.postMessage({
					__imgui_bridge: 1,
					type: "eval",
					id: id,
					code: code,
					context: context || {}
				}, "*");
				return true;
			} catch (e) {
				console.error("ImGuiHost: postMessage to frame failed:", e);
				return false;
			}
		}

		function flushQueue() {
			if (!channelReady) return;
			var pending = queued;
			queued = [];
			for (var i = 0; i < pending.length; i++) {
				var q = pending[i];
				if (!postToFrame(q.id, q.code, q.context)) {
					queued.push(q);
					break;
				}
			}
		}

		function emitEvalReadyOnce() {
			if (evalReadyEmitted) return;
			evalReadyEmitted = true;
			try {
				if (Events && Events.Call) Events.Call("EvalReady");
			} catch (e) {
				console.error("ImGuiHost: EvalReady emit failed:", e);
			}
		}

		function emitImGuiReady(info) {
			try {
				if (Events && Events.Call) Events.Call("ImGuiReady", info || {});
			} catch (e) {
				console.error("ImGuiHost: ImGuiReady emit failed:", e);
			}
		}

		function onDoEval(id, code) {
			if (!channelReady) {
				queued.push({ id: id, code: code, context: {} });
				return;
			}
			if (!postToFrame(id, code, {})) {
				queued.push({ id: id, code: code, context: {} });
			}
		}

		function onDoEvalWithContext(id, code, context) {
			if (!channelReady) {
				queued.push({ id: id, code: code, context: context || {} });
				return;
			}
			if (!postToFrame(id, code, context || {})) {
				queued.push({ id: id, code: code, context: context || {} });
			}
		}

		// Subscribe to Lua requests (tolerate plain browsers without engine Events).
		try {
			if (Events && Events.Subscribe) {
				Events.Subscribe("DoEval", onDoEval);
				Events.Subscribe("DoEvalWithContext", onDoEvalWithContext);
			} else {
				console.warn("ImGuiHost: window.Events missing (plain browser?), Lua bridge disabled.");
			}
		} catch (e) {
			console.error("ImGuiHost: Events.Subscribe failed:", e);
		}

		// Receive replies + readiness from the iframe.
		window.addEventListener("message", function (e) {
			var d = e && e.data;
			if (!d || !d.__imgui_bridge) return;
			if (d.type === "result") {
				try {
					if (Events && Events.Call) Events.Call("EvalResult", d.id, !!d.ok, d.payload === undefined ? null : d.payload);
				} catch (err) {
					console.error("ImGuiHost: EvalResult forward failed:", err);
				}
				return;
			}
			if (d.type === "ready") {
				if (!channelReady) {
					channelReady = true;
					hideFallback();
					flushQueue();
					emitEvalReadyOnce();
				}
				emitImGuiReady(d.info);
				return;
			}
		});

		var frame = getFrame();
		if (frame) {
			frame.addEventListener("load", function () {
				frameLoaded = true;
				hideFallback();
				console.log("ImGui frame loaded (waiting for bridge ready via postMessage).");
			});
		} else {
			console.warn('ImGuiHost: no frame found with id "' + FRAME_ID + '".');
		}

		try {
			document.getElementById("fallback-remote").addEventListener("click", function () {
				useRemote("Manual switch requested.");
			});
			document.getElementById("fallback-retry").addEventListener("click", function () {
				usingRemote = false;
				hideFallback();
				setFrameSrc(LOCAL_SRC);
			});
		} catch (e) { /* buttons missing */ }

		forceTransparency();

		// Debug aid: DevTools can poll window.__imgui_top().
		window.__imgui_top = function () {
			var f = getFrame();
			return {
				channelReady: channelReady, frameLoaded: frameLoaded,
				usingRemote: usingRemote, queued: queued.length,
				evalReadyEmitted: evalReadyEmitted, src: f && f.src
			};
		};

		// Local file missing -> neither load nor ready fires: fall back to remote.
		// File exists but slow (first WASM compile) -> load fires, keep waiting.
		setTimeout(function () {
			if (!channelReady && !frameLoaded && !usingRemote) {
				useRemote("Local demo not ready (./ImGuiDemo.html missing or blocked).");
			} else if (!channelReady && frameLoaded) {
				showFallback("Local demo loading (first WASM compile can take a while)...");
			}
		}, 8000);

		// Still nothing after 25s: show hint instead of a dead page.
		setTimeout(function () {
			if (!channelReady) {
				showFallback("ImGui demo still not ready. Local: run imgui_web_demo/build.cmd debug. Remote needs network + WebGPU.");
			}
		}, 25000);
	</script>
</body>

</html>
